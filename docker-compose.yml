# define postgres
services:
  app:
    build:
      context: ./java-backend
    image: personal_finance_backend
    ports:
      # Host port is only for the SSH tunnel; the VPS sets APP_HOST_PORT=8081
      # because easypost already uses 127.0.0.1:8080.
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    env_file:
      - .app.env
    depends_on:
      - postgres
    networks:
      personal_finance_network:
      # Edge nginx (vps-dev-settings) reaches the API as finance-backend:8080
      proxy:
        aliases:
          - finance-backend
    profiles:
      - prod
  frontend:
    build:
      context: frontend
      args:
        # NEXT_PUBLIC_* vars are inlined into the browser bundle at build time,
        # so this must be reachable from the browser, not from other containers.
        # Assumes access via `ssh -L 8080:localhost:8080 ...` per the tunnel setup.
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    image: personal_finance_frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - app
    networks:
      - personal_finance_network
    profiles:
      - prod
  postgres:
    image: postgres:12
    container_name: db
    env_file:
      - .db.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      personal_finance_network:
        aliases:
          - db
    profiles:
      - db
      - prod

networks:
  personal_finance_network:
    driver: bridge
  # Created once with `docker network create proxy`; shared with the edge proxy stack.
  proxy:
    external: true
volumes:
  postgres-data:
